<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" role="img" aria-labelledby="t d">
  <title id="t">Order of Powers - 8개 지역 지도 초안</title>
  <desc id="d">실제 국경이 아닌 추상적인 8개 지역 도형. 각 지역의 영향력 토큰 위치를 원형 마커로 표시한다.</desc>
  <rect id="background" width="1000" height="560" fill="#eef1f4"/>
  <g id="northAmerica-group">
    <polygon id="northAmerica" points="30,50 270,35 295,120 255,215 195,265 120,225 60,150" fill="#8fa9c4" stroke="#ffffff" stroke-width="3" stroke-linejoin="round"/>
    <text x="165" y="118" text-anchor="middle" font-family="Noto Sans KR, sans-serif" font-size="20" font-weight="700" fill="#1f2933">북아메리카</text>
    <circle id="northAmerica-marker" cx="165" cy="152" r="12" fill="#ffffff" fill-opacity="0.85" stroke="#1f2933" stroke-width="2"/>
  </g>
  <g id="southAmerica-group">
